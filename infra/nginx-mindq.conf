# MindQ API — Nginx site (reference template, P2-12).
#
# Chain: Client -> Cloudflare -> Lightsail LB -> Nginx (this file) -> Uvicorn.
# Install: /etc/nginx/sites-available/mindq, symlink into sites-enabled,
#          `nginx -t && systemctl reload nginx`.
#
# Sanitized: no hostnames, IPs, or certificates. Replace the placeholders
# marked <...> per host. Keep the timeout/body values in sync with DEPLOYMENT.md
# ("Host configuration (infra/)").

upstream mindq_api {
    # Uvicorn from mindq.service, bound to loopback only.
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    # The Lightsail LB terminates TLS and forwards plain HTTP to the node.
    listen 80;
    listen [::]:80;
    server_name <api-hostname>;

    # Above the largest app-level cap (JD PDF upload, 10 MiB) plus multipart
    # overhead; the app enforces the exact per-endpoint limits.
    client_max_body_size 15m;

    # Must exceed asyncpg command_timeout (60s) and PDF/report rendering so
    # Nginx never returns 504 for a request the app would still complete.
    proxy_connect_timeout 5s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;
    send_timeout 90s;

    # Large bulk-report ZIP parts and PDFs stream through.
    proxy_buffering on;
    proxy_max_temp_file_size 256m;

    server_tokens off;

    access_log /var/log/nginx/mindq.access.log;
    error_log  /var/log/nginx/mindq.error.log warn;

    location / {
        proxy_pass http://mindq_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        # Append to the forwarded chain; the app trusts TRUSTED_PROXY_HOPS=2 and
        # prefers CLIENT_IP_HEADER=CF-Connecting-IP (see DEPLOYMENT.md).
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Request-Id      $request_id;
    }

    # LB health checks: keep them out of the access log.
    location = /health {
        proxy_pass http://mindq_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://mindq_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }
}
